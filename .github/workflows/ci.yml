name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Per-commit gate: format + lint only (fast, cheap). clippy --all-targets
  # type-checks every bin/test/example across the workspace with -D warnings.
  # `cargo test` runs as the release gate instead (release.yml), and the
  # release's web-cef build exercises the CEF helper/webhost/pack path.
  #
  # The system deps are still required: clippy compiles dependency build
  # scripts (ffmpeg-sys, shaderc-sys, cpal...), which need the headers.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev cmake ninja-build pkg-config \
            libavcodec-dev libavformat-dev libavutil-dev libavdevice-dev \
            libavfilter-dev libswscale-dev libswresample-dev \
            libasound2-dev libpulse-dev \
            libwayland-dev libxkbcommon-dev libxcb1-dev \
            libshaderc-dev glslang-dev

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The port to Windows is only a port while something checks it. The crate that
  # owns the Windows desktop, the one that owns the control socket, the launcher,
  # the audio device, the bake cache, the shader cache and the Steam client are
  # where every `cfg(windows)` branch lives, and none of them needs ffmpeg or
  # shaderc — so cross-compiling just those catches the regression that matters,
  # a `std::os::unix` import creeping back in, on the same runner and in seconds.
  #
  # kirie-web is checked with its WebView2 host, which is how Windows shows web
  # wallpapers and is all unsafe COM.
  #
  # kirie-bake, kirie-shader and kirie-steam-helper joined the list after a pass
  # found all three asking for XDG_CACHE_HOME or HOME on a platform that sets
  # neither. Nothing was compiling them for Windows, so nothing said so.
  #
  # The rest of the workspace is not cross-checked here on purpose: it reaches
  # ffmpeg, which would mean a Windows ffmpeg on a Linux runner. The release
  # workflow builds the whole thing on Windows, where that is somebody else's
  # problem.
  windows:
    name: Windows cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2

      # Some build scripts compile C for the target.
      - name: Install the mingw toolchain
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Cross-check the platform crates
        env:
          CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
          CXX_x86_64_pc_windows_gnu: x86_64-w64-mingw32-g++
          AR_x86_64_pc_windows_gnu: x86_64-w64-mingw32-ar
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: |
          cargo clippy --target x86_64-pc-windows-gnu --all-targets \
            -p kirie-platform -p kirie-ipc -p kirie-launcher -p kirie-audio \
            -p kirie-bake -p kirie-shader -p kirie-steam-helper \
            -p kirie-web --features kirie-web/webview2 \
            -- -D warnings
