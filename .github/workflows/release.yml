name: Release
# Produces a fully-populated DRAFT release you review and Publish, or a published
# prerelease if you tick that box. Kick off from Actions -> Release -> Run
# workflow (optionally type a version; blank = auto).
# It computes the version + changelog, gates on the full test suite, builds the
# artifacts, and creates the draft with all of them + notes attached in one shot.
#
# Artifacts: three STANDALONE executables, no tarballs (chmod +x after
# download; all with ffmpeg + shaderc statically linked via `--features portable`):
#   kirie              - portable single binary. Only universal dynamic deps
#                        (glibc, alsa, pulse, xcb); runs on any distro with
#                        glibc >= 2.35 (Ubuntu 22.04, Debian 12, Fedora 36 and
#                        newer).
#   kirie-web-cef      - SINGLE self-extracting file with bundled Chromium: the
#                        engine + the whole CEF runtime (libcef.so, resources,
#                        locales) + the kirie-webhost browser process + the CEF
#                        subprocess helper, stripped, compressed and appended
#                        behind a launcher stub. One executable, no runtime dir,
#                        no system browser; self-extracts to cache on first run.
#                        The ENGINE binary links no libcef - the browser runs
#                        out-of-process in kirie-webhost.
#   kirie-web-webview  - + web wallpapers via the system webkit2gtk-4.1,
#                        presented natively on the compositor's background
#                        layer (webkit has no offscreen path, so instead of
#                        compositing frames the host owns a gtk-layer-shell
#                        window). ONE file: the engine re-executes itself as
#                        the host. REQUIRES
#                        webkit2gtk-4.1 + libsoup-3.0 + gtk-layer-shell
#                        installed; Wayland only for web items. Built on
#                        glibc 2.35.
#
#   kirie-windows-x86_64.exe
#                      - Windows 10 1809 or newer, x86_64. Scenes, video and
#                        images on the desktop, behind the icons, through the
#                        WorkerW window Explorer keeps for the wallpaper. No web
#                        wallpapers: there is no browser view in the Windows
#                        backend yet, and one is refused with a reason rather
#                        than shown blank. ffmpeg comes from vcpkg and shaderc is
#                        built from source, both linked in, so the download is
#                        one file that needs nothing installed.
#
# Job shape: default + web-cef build IN ONE JOB, on GitHub's ubuntu-22.04.
# Same target dir - the web build reuses the whole dependency graph incl. the
# from-source static ffmpeg/shaderc, so they compile once, not twice. The
# webview variant needs the same image for webkit2gtk-4.1. Shared setup + the
# cargo/target cache live in .github/actions/release-setup; a glibc-floor
# guard fails the build if the runner image ever drifts.
#
# These two used to run on local org runners: a focal image for the glibc 2.31
# floor, and a jammy one for webkit. That is faster when the machine is up, and
# stops the release dead when it is not - a job addressed to an offline runner
# queues rather than fails, so nothing says why the release never finished.
# GitHub's runners are always there, and jammy is the oldest Ubuntu they still
# host, so the portability floor is now 2.35 rather than 2.31. That drops
# Debian 11, Ubuntu 20.04 and RHEL 8, all of which are themselves out of
# support. Nothing else about the build changes.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, e.g. v0.2.0. Blank = auto-detect from Conventional Commits."
        required: false
        default: ""
      prerelease:
        description: "Publish straight away as a prerelease, instead of leaving a draft to review."
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # 1. Version + changelog; publish RELEASE_NOTES.md as an artifact.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          input="${{ inputs.version }}"
          if [ -n "$input" ]; then
            version="$input"; case "$version" in v*) ;; *) version="v$version" ;; esac
          else
            raw="$(git cliff --bumped-version 2>/dev/null || true)"
            ver="${raw#v}"; if [ -z "$ver" ] || [ "$ver" = "0.0.0" ]; then ver="0.1.0"; fi
            version="v$ver"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"
      - name: Generate changelog
        run: git cliff --unreleased --tag "${{ steps.version.outputs.version }}" --strip all -o RELEASE_NOTES.md
      - name: Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 1

  # 1b. Test gate: no artifact ships from a tree with failing tests. This is
  #     the full `cargo test --workspace` (per-commit CI is lint-only).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev cmake ninja-build pkg-config \
            libavcodec-dev libavformat-dev libavutil-dev libavdevice-dev \
            libavfilter-dev libswscale-dev libswresample-dev \
            libasound2-dev libpulse-dev \
            libwayland-dev libxkbcommon-dev libxcb1-dev \
            libshaderc-dev glslang-dev
      - run: cargo test --workspace

  # 2. default + web-cef in one job (glibc 2.35 floor). The default build
  #    compiles the full portable dependency graph (static ffmpeg + shaderc);
  #    the web-cef build on top only adds the web crates + the two CEF-linked
  #    binaries. Both artifacts upload from here.
  build-linux:
    needs: [prepare, test]
    env:
      # Stamped into the binaries so `kirie update` can tell which
      # release it is running; a local build carries no stamp.
      V: ${{ needs.prepare.outputs.version }}
    # jammy = glibc 2.35, the oldest floor GitHub still hosts an image for.
    # It is also the last one whose pip lets `release-setup` install cmake with
    # `--user`; 24.04 refuses under PEP 668.
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/release-setup
        with:
          cache-key: release-linux-jammy

      - name: Set crate version
        run: |
          v="${{ needs.prepare.outputs.version }}"; v="${v#v}"
          sed -i -E "0,/^version = \"[0-9]+\.[0-9]+\.[0-9]+\"/s//version = \"$v\"/" Cargo.toml

      # The stock `ffmpeg-next/build` compiles ffmpeg with a hardcoded configure
      # line: every decoder, muxer and network protocol, ~19 MB of the binary.
      # Build the trimmed one instead and link that.
      - name: Build the trimmed static ffmpeg
        run: ./scripts/build-ffmpeg.sh "$HOME/.cache/kirie/ffmpeg-static"

      - name: Build default (portable)
        run: |
          export FFMPEG_DIR="$HOME/.cache/kirie/ffmpeg-static"
          KIRIE_RELEASE_TAG="$V" cargo build --release -p kirie --features portable

      # Guard: ffmpeg + shaderc must be static; the engine must never link
      # libcef (the browser stays out-of-process in kirie-webhost).
      - name: Verify static deps + no libcef in the engine
        run: |
          set -euo pipefail
          needed="$(readelf -d target/release/kirie | grep NEEDED || true)"
          echo "$needed"
          if echo "$needed" | grep -iqE 'libav|libsw|shaderc|glslang'; then
            echo "::error::churny soname present — ffmpeg/shaderc not static"; exit 1
          fi
          if echo "$needed" | grep -iq 'libcef'; then
            echo "::error::engine links libcef — the browser must stay out-of-process (kirie-webhost)"; exit 1
          fi
          echo "ok: ffmpeg + shaderc static; no libcef in the engine"
          # The glibc floor comes from the runner image (jammy) - fail loudly
          # if the image ever moves and silently raises the floor.
          floor=$(objdump -T target/release/kirie | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          echo "glibc floor: $floor"
          case "$floor" in GLIBC_2.3[0-5]|GLIBC_2.[0-9]|GLIBC_2.[12][0-9]) ;; *)
            echo "::error::glibc floor rose to $floor (runner image drift?) - portable promise is >=2.35"; exit 1;;
          esac

      - name: Stage default binary
        run: cp target/release/kirie kirie-linux-x86_64

      - name: Build web-cef (engine + helper + webhost)
        run: |
          export FFMPEG_DIR="$HOME/.cache/kirie/ffmpeg-static"
          KIRIE_RELEASE_TAG="$V" cargo build --release -p kirie --features portable,web-cef
          KIRIE_RELEASE_TAG="$V" cargo build --release -p kirie-web --features cef --bin kirie-cef-helper
          KIRIE_RELEASE_TAG="$V" cargo build --release -p kirie-web --features cef --bin kirie-webhost
          KIRIE_RELEASE_TAG="$V" cargo build --release -p kirie-launcher

      - name: Package web-cef single file
        run: |
          set -euo pipefail
          ./target/release/kirie-pack target/release kirie-web-cef-linux-x86_64
          chmod +x kirie-web-cef-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: kirie-linux-x86_64
          path: kirie-linux-x86_64
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: kirie-web-cef-linux-x86_64
          path: kirie-web-cef-linux-x86_64
          if-no-files-found: error
          retention-days: 1

  # 3. webview variant: ubuntu:22.04 ships webkit2gtk-4.1 (debian:11 only 4.0).
  build-webview:
    needs: [prepare, test]
    env:
      # Stamped into the binaries so `kirie update` can tell which
      # release it is running; a local build carries no stamp.
      V: ${{ needs.prepare.outputs.version }}
    # jammy (22.04) is where webkit2gtk-4.1 lives; 24.04 ships 4.1 too but
    # under a soname this build has never been tried against.
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/release-setup
        with:
          cache-key: release-webview-jammy
          extra-apt: libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-layer-shell-dev

      - name: Set crate version
        run: |
          v="${{ needs.prepare.outputs.version }}"; v="${v#v}"
          sed -i -E "0,/^version = \"[0-9]+\.[0-9]+\.[0-9]+\"/s//version = \"$v\"/" Cargo.toml

      # The stock `ffmpeg-next/build` compiles ffmpeg with a hardcoded configure
      # line: every decoder, muxer and network protocol, ~19 MB of the binary.
      # Build the trimmed one instead and link that.
      - name: Build the trimmed static ffmpeg
        run: ./scripts/build-ffmpeg.sh "$HOME/.cache/kirie/ffmpeg-static"

      - name: Build web-webview (portable single binary, host carried inside)
        run: |
          export FFMPEG_DIR="$HOME/.cache/kirie/ffmpeg-static"
          # The host links gtk; the engine must not. Build it separately and
          # embed it, so scene-only wallpapers never map the gtk chain.
          KIRIE_RELEASE_TAG="$V" cargo build --release -p kirie-web --features webview --bin kirie-webviewhost
          KIRIE_EMBED_WEBVIEWHOST="$PWD/target/release/kirie-webviewhost" \
            KIRIE_RELEASE_TAG="$V" cargo build --release -p kirie --features portable,web-webview

      - name: Verify static deps + engine stays webkit-free
        run: |
          set -euo pipefail
          needed="$(readelf -d target/release/kirie | grep NEEDED || true)"
          echo "$needed"
          if echo "$needed" | grep -iqE 'libav|libsw|shaderc|glslang'; then
            echo "::error::churny soname present — ffmpeg/shaderc not static"; exit 1
          fi
          # The engine must link NEITHER webkit NOR gtk: the host that needs
          # them is carried as an embedded binary and extracted on first web
          # use, so a scene-only wallpaper never maps that chain.
          if echo "$needed" | grep -iqE 'webkit|libsoup|libgtk|libgdk'; then
            echo "::error::engine links the browser/gtk stack — it must stay out of the engine"; exit 1
          fi
          echo "ok: ffmpeg + shaderc static; engine free of webkit and gtk"

      - name: Stage webview binary
        run: cp target/release/kirie kirie-web-webview-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: kirie-web-webview-linux-x86_64
          path: kirie-web-webview-linux-x86_64
          if-no-files-found: error
          retention-days: 1



  build-macos:
    needs: [prepare, test]
    env:
      V: ${{ needs.prepare.outputs.version }}
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # nasm builds ffmpeg's assembly; cmake and ninja build shaderc. Homebrew's
      # ffmpeg is deliberately not used: linking against it ties the binary to
      # whichever version the runner had, and it then refuses to start on a Mac
      # with a different one.
      - name: Install what the build needs
        run: brew install nasm pkg-config cmake ninja

      - uses: Swatinem/rust-cache@v2
        with:
          key: kirie-macos-aarch64

      - name: Build the trimmed static ffmpeg
        run: ./scripts/build-ffmpeg.sh "$HOME/.cache/kirie/ffmpeg-static"

      - name: Set crate version
        run: |
          python3 - <<'PY'
          import os, re
          want = os.environ["V"].lstrip("v")
          text = open("Cargo.toml").read()
          text = re.sub(r'^version = "\d+\.\d+\.\d+"', f'version = "{want}"', text, count=1, flags=re.M)
          open("Cargo.toml", "w").write(text)
          PY

      # portable: ffmpeg and shaderc linked in, so the binary depends on nothing
      # a Mac does not already have. web wallpapers use the system WebKit.
      - name: Build (self-contained)
        run: |
          export FFMPEG_DIR="$HOME/.cache/kirie/ffmpeg-static"
          KIRIE_RELEASE_TAG="$V" cargo build --release -p kirie \
            --features portable,web-webview

      - name: Check it carries its own ffmpeg
        run: |
          set -euo pipefail
          linked="$(otool -L target/release/kirie)"
          echo "$linked"
          if echo "$linked" | grep -qiE "libav|libsw|homebrew"; then
            echo "::error::the binary still needs Homebrew libraries"; exit 1
          fi
          echo "ok: nothing from Homebrew is linked"

      - name: Stage binary
        run: |
          set -euo pipefail
          cp target/release/kirie kirie-macos-aarch64
          chmod +x kirie-macos-aarch64
          file kirie-macos-aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: kirie-macos-aarch64
          path: kirie-macos-aarch64
          if-no-files-found: error
          retention-days: 1



  # 3b. Windows: one self-contained .exe. ffmpeg comes from vcpkg rather than
  #     from scripts/build-ffmpeg.sh, because that script wants a unix shell,
  #     nasm and `make`; vcpkg is the route ffmpeg-sys-next supports on MSVC,
  #     and it is the only one that also names the Windows system libraries a
  #     static avformat needs (secur32, ws2_32). Setting FFMPEG_DIR here would
  #     skip that path and under-link, so it deliberately stays unset.
  build-windows:
    needs: [prepare, test]
    env:
      V: ${{ needs.prepare.outputs.version }}
      # Static ffmpeg against the dynamic CRT: that is the combination Rust's
      # MSVC target links, and the one shaderc-sys builds itself with (/MD).
      TRIPLET: x64-windows-static-md
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: kirie-windows-x86_64

      # shaderc-sys carries glslang and SPIRV-Tools in the crate and builds them
      # with cmake; on MSVC it insists on Ninja, which the runner image does not
      # ship. cmake, git and python it already has.
      - name: Install ninja
        run: choco install ninja --no-progress -y

      # Building ffmpeg takes longer than everything else here put together, and
      # what it produces only changes when vcpkg's own checkout does.
      # VCPKG_INSTALLATION_ROOT comes from the runner image rather than from
      # this file, so it is not in the `env` context a `with:` can read — hence
      # passing it out as a step output.
      - name: Find vcpkg
        id: vcpkg
        run: |
          set -euo pipefail
          root="${VCPKG_INSTALLATION_ROOT:-C:/vcpkg}"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "rev=$(git -C "$root" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Cache the ffmpeg vcpkg built
        uses: actions/cache@v4
        with:
          path: ${{ steps.vcpkg.outputs.root }}/installed
          key: vcpkg-ffmpeg-${{ env.TRIPLET }}-${{ steps.vcpkg.outputs.rev }}

      # The same four libraries the crate asks for: codec, format,
      # software-scaling and software-resampling, and nothing else.
      - name: Build a static ffmpeg
        run: |
          set -euo pipefail
          "${{ steps.vcpkg.outputs.root }}/vcpkg" install \
            "ffmpeg[core,avcodec,avformat,swresample,swscale]:$TRIPLET"

      - name: Set crate version
        run: |
          v="${{ needs.prepare.outputs.version }}"; v="${v#v}"
          sed -i -E "0,/^version = \"[0-9]+\.[0-9]+\.[0-9]+\"/s//version = \"$v\"/" Cargo.toml

      # No FFMPEG_DIR: see the note on this job. VCPKG_ROOT is what the vcpkg
      # crate reads, and VCPKGRS_TRIPLET pins it to the same triplet built above
      # instead of letting it guess.
      - name: Build (self-contained)
        env:
          VCPKG_ROOT: ${{ steps.vcpkg.outputs.root }}
          VCPKGRS_TRIPLET: x64-windows-static-md
        run: KIRIE_RELEASE_TAG="$V" cargo build --release -p kirie --features portable

      # `dumpbin` lives in the MSVC toolchain, which cargo finds by itself but
      # which is not on PATH until something puts it there.
      - name: Put the MSVC tools on PATH
        uses: ilammy/msvc-dev-cmd@v1

      # Anything outside System32 in this list would have to ship beside the
      # exe, which is the one thing a single-file download cannot do.
      - name: Check it carries its own ffmpeg
        run: |
          set -euo pipefail
          linked="$(dumpbin //DEPENDENTS target/release/kirie.exe)"
          echo "$linked"
          if echo "$linked" | grep -iqE 'av(codec|format|util|device|filter)|sw(scale|resample)|shaderc'; then
            echo "::error::ffmpeg or shaderc is a DLL here — it must be linked in"; exit 1
          fi
          echo "ok: ffmpeg and shaderc are linked in"

      - name: Stage binary
        run: cp target/release/kirie.exe kirie-windows-x86_64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: kirie-windows-x86_64.exe
          path: kirie-windows-x86_64.exe
          if-no-files-found: error
          retention-days: 1


  # 4. Create/update the draft release once, with all built artifacts + notes.
  release:
    needs: [prepare, build-linux, build-webview, build-macos, build-windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      V: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Download changelog
        uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "kirie-*"
          merge-multiple: true
      - name: Create or update the draft release
        run: |
          set -euo pipefail
          # Three standalone executables (no archives): kirie, kirie-web-cef
          # (self-extracting), kirie-web-webview.
          files=$(ls kirie-*)
          cat >> RELEASE_NOTES.md <<'EOF'

          ## Downloads

          All assets are standalone executables — download, `chmod +x`, run.

          | File | Variant |
          | --- | --- |
          | `kirie-linux-x86_64` | scenes + video + images |
          | `kirie-web-cef-linux-x86_64` | + web wallpapers, bundled Chromium (self-extracting, no system deps) |
          | `kirie-web-webview-linux-x86_64` | + web wallpapers via the system webkit, presented natively on the compositor's background layer. One file — the webkit host is built in. Needs `webkit2gtk-4.1`, `libsoup3`, `gtk-layer-shell` installed; web items are Wayland-only. |
          | `kirie-macos-aarch64` | Apple Silicon — scenes, video, images, and web wallpapers through the system WebKit. Self-contained; run `xattr -d com.apple.quarantine kirie-macos-aarch64` once, since it is not notarized. |
          | `kirie-windows-x86_64.exe` | Windows 10 1809 or newer — scenes, video and images on the desktop behind the icons. Self-contained; web wallpapers are not supported yet. SmartScreen will warn once, since it is not signed. |

          EOF
          echo "attaching:"; echo "$files"
          # No checkout here, so gh must stay API-only: GH_REPO gives the repo and
          # --target gives create an explicit commit. Update in place if it exists.
          if gh release view "$V" >/dev/null 2>&1; then
            state="$(gh release view "$V" --json isDraft,isPrerelease \
              --jq 'if .isDraft then "--draft" elif .isPrerelease then "--prerelease" else "--latest" end')"
            echo "release $V exists ($state) — updating in place (not deleting)"
            gh release edit "$V" $state --title "$V" --notes-file RELEASE_NOTES.md
            # Clear each asset by name first. `--clobber` alone is not enough:
            # a run cancelled mid-upload leaves a half-created asset, and the
            # API then answers 400 for a fresh upload of that name rather than
            # replacing it (hit on the 107 MB cef binary). Deleting is allowed
            # to fail — usually it is simply not there.
            for f in $files; do
              gh release delete-asset "$V" "$f" --yes 2>/dev/null || true
            done
            # And retry: uploads this size cross a network, and one failure
            # should not throw away a green build.
            uploaded=0
            for attempt in 1 2 3; do
              if gh release upload "$V" $files --clobber; then uploaded=1; break; fi
              echo "upload attempt $attempt failed; retrying in 20s"
              sleep 20
            done
            [ "$uploaded" = 1 ] || { echo "::error::could not upload assets"; exit 1; }
          else
            # A draft keeps the tag unmade until somebody presses Publish; a
            # prerelease tags and publishes now, which is what a build meant
            # for testers wants.
            state="--draft"
            if [ "${{ inputs.prerelease }}" = "true" ]; then state="--prerelease"; fi
            echo "creating $V ($state)"
            gh release create "$V" "$state" --title "$V" --target "$GITHUB_SHA" \
              --notes-file RELEASE_NOTES.md $files
          fi
          echo "$V ready with all artifacts attached."

      # The binaries now live on the release, so the copies that carried them
      # between jobs are dead weight — and not free: 60 of them, 1.85 GB, once
      # filled the account's artifact storage and failed an unrelated repo's
      # first release run. retention-days is the backstop; this is the fix.
      - name: Drop this run's artifacts
        if: always()
        run: |
          set -uo pipefail
          gh api "/repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[].id' | while read -r id; do
            gh api -X DELETE "/repos/$GH_REPO/actions/artifacts/$id" >/dev/null 2>&1 \
              && echo "deleted artifact $id" \
              || echo "could not delete artifact $id (leaving it)"
          done
