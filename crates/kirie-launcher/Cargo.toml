[package]
name = "kirie-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Self-extracting launcher: unpacks an appended CEF runtime to cache and execs the real engine, so kirie ships as a single file"

[[bin]]
name = "kirie-launcher"
path = "src/main.rs"

[[bin]]
name = "kirie-pack"
path = "src/bin/pack.rs"

[dependencies]
blake3 = { workspace = true }
zstd = { version = "0.13", features = ["zstdmt"] }
tar = "0.4"

[lints]
workspace = true
