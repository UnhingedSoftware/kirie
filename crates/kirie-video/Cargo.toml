[package]
name = "kirie-video"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Statically link a prebuilt ffmpeg, pointed at by `FFMPEG_DIR`. Removes the
# version-specific libav*/libsw* sonames from the binary so it runs across
# distros. `scripts/build-ffmpeg.sh` produces the prefix; the release workflow
# runs it first.
#
# NOT `ffmpeg-next/build`: that builds ffmpeg with a `./configure` line the
# crate hardcodes and exposes no hook into, which enables every decoder,
# muxer and network protocol ffmpeg has — about 19 MB of a 46 MB release
# binary, for a program that opens six container types off local disk.
# `static` takes the prebuilt instead, so the trim is ours to choose.
static-ffmpeg = ["ffmpeg-next/static"]
# Escape hatch: build ffmpeg from source with its stock (untrimmed) configure,
# for a platform where the prebuilt prefix cannot be produced.
static-ffmpeg-from-source = ["ffmpeg-next/build"]
# VAAPI hardware video decode (SPEC T11): attach a VAAPI hw device at decoder
# open and download decoded surfaces to system memory for the existing RGBA
# conversion path. Degrades to CPU decode (info log) when no render node/
# driver/codec support exists, so behavior without a VAAPI stack is unchanged.
# Holds the crate's only unsafe code, isolated in src/hw.rs (module-level
# allow with SAFETY comments; the crate stays deny(unsafe_code)). Off by
# default. True zero-copy dma-buf → wgpu import is follow-up work.
vaapi = []

[dependencies]
kirie-platform = { path = "../kirie-platform" }
ffmpeg-next = { workspace = true }
crossbeam-channel = { workspace = true }
cpal = { workspace = true }
ringbuf = { workspace = true }
triple_buffer = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }

[lints]
workspace = true
