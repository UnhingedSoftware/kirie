[package]
name = "kirie"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "kirie (切り絵) — Wallpaper Engine compatible wallpaper renderer for Linux"

[features]
tui = ["dep:ratatui"]
default = ["tui"]
portable = ["kirie-video/static-ffmpeg", "kirie-render/static-shaderc"]
portable-fatlibs = ["kirie-video/static-ffmpeg-from-source", "kirie-render/static-shaderc"]
web-cef = ["dep:kirie-web", "kirie-web/host"]
web-webview = ["dep:kirie-web", "kirie-web/webview-client", "kirie-web/webview-mac"]
# Windows' system browser view. The runtime is part of Windows (or one
# download from Microsoft), so this adds no files to the release.
web-webview2 = ["dep:kirie-web", "kirie-web/webview2"]
web-webview-inproc = ["dep:kirie-web", "kirie-web/webview-client", "kirie-web/webview"]
vaapi = ["kirie-video/vaapi"]

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"

# Windows delivers Ctrl-C to a console handler rather than as a signal, so
# signal-hook's iterator has no counterpart there. This is the safe wrapper
# around the handler that does the same job.
[target.'cfg(windows)'.dependencies]
ctrlc = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSView", "NSResponder"] }

[dependencies]
zbus = { workspace = true }
kirie-formats = { workspace = true }
kirie-platform = { path = "../kirie-platform" }
kirie-render = { path = "../kirie-render" }
kirie-bake = { path = "../kirie-bake" }
kirie-video = { path = "../kirie-video" }
kirie-ipc = { path = "../kirie-ipc" }
kirie-steam-helper = { path = "../kirie-steam-helper" }
kirie-audio = { path = "../kirie-audio" }
kirie-web = { path = "../kirie-web", optional = true }
clap = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }
texture2ddecoder = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }
crossbeam-channel = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ratatui = { version = "0.30.2", optional = true }

[lints]
workspace = true
